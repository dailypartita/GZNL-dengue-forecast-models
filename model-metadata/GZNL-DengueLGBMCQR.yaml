designated_model: false
data_inputs: "Monthly national dengue case counts from this hub's target-data/time-series.csv (China CDC notifiable-disease reports / cn_cdc_dashboard), merged by month to lag-1 NOAA ONI (enso_oni, 1950-01 through 2026-08) and ERA5 China monthly means (temp_mean, precip_mean, rel_humid_mean; geo_name China, 2010-01 through 2026-09). Incomplete climate rows are dropped, not imputed."
methods: "Per-horizon LightGBM quantile regression (23 hub quantiles) on log1p dengue counts with lag, calendar, and lag-1 ENSO/ERA5 climate features, plus online sliding-window CQR."
methods_long: "GZNL-DengueLGBMCQR is a per-horizon LightGBM quantile regression model with online conformalized quantile regression (CQR), trained on the hub monthly national dengue series (mo inc dengue cases, location CN; 273 months, 2004-01 through 2026-09) for the 2026-11-01 round. The target is that hub snapshot; external case totals are not substituted. At origin month t the features use only information known at t: lag1=y_t, lag2, lag3, lag6, lag12 (lag12 is y at t-11), trailing means r3m and r12m, d1=lag1-lag2, origin-month Fourier terms cal_sin1 and cal_cos1, and lag-1 climate enso_oni_l1, temp_mean_l1, precip_mean_l1, and rel_humid_mean_l1, equal to NOAA ONI and ERA5 China (geo_name China) in month t-1. Every lead uses this same feature row, so no horizon sees climate from month t or later. ONI covers 1950-01 through 2026-08 (920 months) and ERA5 China covers 2010-01 through 2026-09 (201 months). For the 2026-09 origin, lag-1 climate is 2026-08. Incomplete rows are dropped and not imputed, so the first complete origin is 2010-02 (200 complete rows through 2026-09). For each lead h=1..5 a separate LightGBM is fit at each of the 23 hub quantiles with objective=quantile, n_estimators=300, learning_rate=0.05, num_leaves=15, and min_child_samples=5. Training is in log1p space; predictions are mapped back with expm1, clipped at 0, and rearranged with np.maximum.accumulate. Hub horizons -1, 0, 1, 2, 3 at reference_date 2026-11-01 are model leads 1 through 5 (targets 2026-10 through 2027-02) because the last observation is 2026-09-01. CQR then expands each complementary pair (q, 1-q) for q<0.5, using score S=max(q_lo-y, y-q_hi) and the empirical quantile of the last 24 origin scores at level ceil((n+1)*(1-alpha))/n with alpha=2q and method=higher. The lower bound is clipped at 0 and the median is left unchanged. CQR starts after a burn-in of 10 origins. Quantiles are again made monotone and non-negative and rounded to integer case counts. On the monthly rolling-origin backtest (origins 2023-09 through 2026-04, leads 1-5, 160 pairs) LightGBM+CQR has mean WIS 516.9 and MAE 683.7, versus WIS 536.2 and MAE 683.7 for uncalibrated LightGBM, with 50/90/95 percent coverage 0.519/0.969/0.969 (raw: 0.206/0.512/0.756). Mean WIS selects CQR. Lead 1 is the exception (raw WIS 308.4 versus CQR 315.3); leads 2-5 favor CQR."
ensemble_of_models: false
